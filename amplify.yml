version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Using Render-like install (no legacy peer deps)"
        - node --version
        - npm --version
        - npm install
    build:
      commands:
        - echo "Starting build..."
        - npm run build
        - echo "Build finished"
        - ls -la dist || true
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'

  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cross-Origin-Opener-Policy'
          value: 'same-origin'
        - key: 'Cross-Origin-Embedder-Policy'
          value: 'require-corp'